<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PageGobbler Promo Tile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px; height: 280px; overflow: hidden;
      background: #1a1008;
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .card { text-align: center; }
    .icon { margin-bottom: 16px; }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 36px; font-weight: 700; letter-spacing: -0.03em;
      color: #F5E6D0;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 14px; color: #D4C4A8; line-height: 1.5; max-width: 320px; margin: 0 auto 18px;
    }
    .features {
      display: flex; gap: 16px; justify-content: center;
    }
    .feature {
      background: #241a0e; border: 1px solid #8A7358;
      border-radius: 8px; padding: 6px 12px; font-size: 11px; color: #E8A849;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <img src="../icons/turkey-32.svg" width="56" height="56" alt="">
    </div>
    <h1>PageGobbler</h1>
    <p class="tagline">Full-page screenshots with smart compression, text extraction, and complete page reverse-engineering.</p>
    <div class="features">
      <span class="feature">Screenshots</span>
      <span class="feature">Text &amp; Metadata</span>
      <span class="feature">ZIP Export</span>
    </div>
  </div>
</body>
</html>
