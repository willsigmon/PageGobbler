<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PageGobbler Popup Mockup</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
    }
    .chrome-frame {
      width: 340px;
      overflow: hidden;
      border-radius: 12px;
      background: var(--color-bg);
      color: var(--color-ink);
      font-size: 13px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
    }
    .container { padding: 16px; position: relative; z-index: 1; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 30px; height: 30px; display: block; }
    .logo h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-ink);
    }
    .version {
      font-size: 11px;
      color: var(--color-muted);
      background: var(--color-surface-2);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
    }
    .page-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .page-status { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-accent); }
    .status-word {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--color-accent-hover);
    }
    .page-card-title { color: var(--color-ink); font-size: 13px; font-weight: 700; }
    .page-card-url { color: var(--color-muted); font-size: 12px; margin-top: 2px; }
    .btn-primary {
      width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--color-accent);
      border-radius: 8px; background: var(--color-accent); color: var(--color-accent-ink);
      font-size: 15px; font-weight: 700; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
    }
    .btn-subtext { font-size: 11px; font-weight: 600; opacity: 0.82; }
    .preset-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .preset {
      min-height: 44px; background: var(--color-surface); border: 1px solid var(--color-border);
      color: var(--color-muted); border-radius: 8px; padding: 6px; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .preset.active { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); background: var(--color-surface-2); }
    .preset strong, .preset span { display: block; }
    .preset strong { color: var(--color-ink); font-size: 12px; }
    .preset span { color: var(--color-muted); font-size: 11px; margin-top: 2px; }
    .settings-toggle {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 44px; margin-top: 12px; color: var(--color-muted); font-size: 13px;
      font-weight: 600; border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <div class="chrome-frame roast-app">
    <div class="container">
      <header>
        <div class="logo">
          <img class="logo-mark" src="../icons/turkey-32.svg" width="30" height="30" alt="">
          <h1>PageGobbler</h1>
        </div>
        <span class="version">v2.1.3</span>
      </header>
      <div class="page-card">
        <div class="page-status">
          <span class="status-dot"></span>
          <span class="status-word">Ready</span>
        </div>
        <div class="page-card-title">Chrome Extensions | Developers</div>
        <div class="page-card-url">developer.chrome.com/docs/extensions</div>
      </div>
      <button class="btn-primary" type="button">
        <span>Gobble This Page</span>
        <span class="btn-subtext">Screenshot + local context pack</span>
      </button>
      <div class="preset-wrap">
        <div class="preset active"><strong>Balanced</strong><span>3 MB WebP</span></div>
        <div class="preset"><strong>Fast</strong><span>Small files</span></div>
        <div class="preset"><strong>Crisp</strong><span>High detail</span></div>
      </div>
      <div class="settings-toggle">
        <span>Settings</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
