<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGobbler</title>
  <meta name="description" content="Local full-page capture. Screenshots, text, and a context pack — all in your browser.">
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="roast-app">
  <div class="container">
    <header>
      <div class="logo">
        <img class="logo-mark" src="../icons/turkey-32.svg" width="30" height="30" alt="">
        <h1>PageGobbler</h1>
      </div>
      <span class="version">v2.1.3</span>
    </header>

    <main>
      <section class="page-card" id="page-card" aria-label="Active page">
        <div class="page-status" id="page-status" aria-live="polite">
          <span class="status-dot" id="page-dot" aria-hidden="true"></span>
          <span class="status-word" id="page-status-word">Checking</span>
        </div>
        <div class="page-card-copy">
          <div class="page-card-title" id="page-title">Checking active tab…</div>
          <div class="page-card-url" id="page-url">PageGobbler runs locally in your browser.</div>
        </div>
      </section>

      <button id="btn-capture" class="btn-primary" type="button">
        <span class="btn-label">Gobble This Page</span>
        <span class="btn-subtext">Screenshot + local context pack</span>
      </button>

      <div class="preset-wrap" role="group" aria-label="Capture presets">
        <button class="preset active" type="button" data-preset="balanced" aria-pressed="true">
          <strong>Balanced</strong>
          <span>3 MB WebP</span>
        </button>
        <button class="preset" type="button" data-preset="fast" aria-pressed="false">
          <strong>Fast</strong>
          <span>Small files</span>
        </button>
        <button class="preset" type="button" data-preset="crisp" aria-pressed="false">
          <strong>Crisp</strong>
          <span>High detail</span>
        </button>
      </div>

      <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">
        <span>Settings</span>
        <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
          <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="settings-panel" id="settings-panel" hidden>
        <div class="setting-group checkbox oneclick-group">
          <label for="set-oneclick">
            <input type="checkbox" id="set-oneclick">
            1-Click Gobble
          </label>
          <div class="setting-hint" id="oneclick-hint">Click the turkey icon to gobble instantly — no popup.</div>
        </div>

        <div class="setting-group">
          <label for="set-max-size">Max File Size (MB)</label>
          <input type="number" id="set-max-size" min="1" max="20" step="0.5" value="3">
        </div>

        <div class="setting-group">
          <label for="set-compression">Compression</label>
          <select id="set-compression">
            <option value="auto">Auto (WebP → JPEG)</option>
            <option value="aggressive">Aggressive (smallest)</option>
            <option value="lossless">Lossless (PNG)</option>
          </select>
        </div>

        <div class="setting-group">
          <label for="set-section-height">Section Max Height (px)</label>
          <input type="number" id="set-section-height" min="1024" max="16384" step="512" value="4096">
        </div>

        <div class="setting-group checkbox">
          <label for="set-ocr">
            <input type="checkbox" id="set-ocr" checked>
            Extract Page Text
          </label>
        </div>

        <div class="setting-group checkbox">
          <label for="set-sections">
            <input type="checkbox" id="set-sections" checked>
            Smart Section Splitting
          </label>
        </div>

        <div class="setting-group">
          <label for="set-quality">Quality</label>
          <div class="range-row">
            <input type="range" id="set-quality" min="0.3" max="1" step="0.05" value="0.92">
            <span id="quality-label">92%</span>
          </div>
        </div>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
