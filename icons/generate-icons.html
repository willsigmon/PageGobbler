<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PageGobbler — Icon Generator</title>
  <style>
    :root {
      --bg: #1a1008;
      --ink: #F5E6D0;
      --muted: #D4C4A8;
      --copper: #D4762C;
      --gold: #E8A849;
    }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    h1 { color: var(--ink); font-size: 28px; letter-spacing: -0.03em; margin: 0 0 8px; }
    p { font-family: "Segoe UI", system-ui, sans-serif; color: var(--muted); max-width: 52ch; }
    code { color: var(--gold); }
    #icons { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; margin-top: 24px; }
    .tile { text-align: center; font-family: "Segoe UI", system-ui, sans-serif; }
    .tile strong { display: block; margin-bottom: 8px; color: var(--copper); }
    canvas { image-rendering: pixelated; border: 1px solid #8A7358; border-radius: 8px; background: #2e2114; }
    a { color: var(--gold); }
  </style>
</head>
<body>
  <h1>PageGobbler icon generator</h1>
  <p>Toolbar turkeys, size-aware: 16px is a silhouette + three feathers. Pipeline: <code>node icons/generate-icons.mjs</code> writes the PNGs. This page is the visual check.</p>
  <div id="icons"></div>
<script>
const sizes = [16, 32, 48, 128];
const C = {
  roast: '#1a1008',
  copper: '#D4762C',
  gold: '#E8A849',
  red: '#C0392B',
  body: '#8B4513',
  breast: '#A0522D',
  tan: '#D2A36A',
  parchment: '#F5E6D0',
};

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTurkey(ctx, size) {
  const u = (n) => (n / 32) * size;
  const ellipse = (cx, cy, rx, ry, fill) => {
    ctx.beginPath();
    ctx.ellipse(u(cx), u(cy), u(rx), u(ry), 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  };

  if (size >= 48) {
    ellipse(4.8, 13.5, 3.6, 8.6, C.red);
    ellipse(27.2, 13.5, 3.6, 8.6, C.red);
  }
  ellipse(8.2, 13.4, 3.6, 8.8, C.red);
  ellipse(23.8, 13.4, 3.6, 8.8, C.copper);
  ellipse(16, 11.8, 3.8, 9.4, C.gold);
  ellipse(16, 22.0, 7.4, 6.4, C.body);
  ellipse(16, 21.2, 5.4, 4.8, C.breast);
  ctx.beginPath();
  ctx.arc(u(16), u(14.6), u(4.8), 0, Math.PI * 2);
  ctx.fillStyle = C.tan;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(u(14.0), u(16.6));
  ctx.lineTo(u(16), u(19.6));
  ctx.lineTo(u(18.0), u(16.6));
  ctx.closePath();
  ctx.fillStyle = C.gold;
  ctx.fill();
  if (size >= 32) {
    ellipse(17.2, 19.6, 1.35, 2.1, C.red);
    ctx.beginPath();
    ctx.arc(u(14.2), u(13.7), u(1.15), 0, Math.PI * 2);
    ctx.fillStyle = C.roast;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(u(17.8), u(13.7), u(1.15), 0, Math.PI * 2);
    ctx.fill();
  }
  if (size >= 128) {
    ctx.beginPath();
    ctx.arc(u(14.55), u(13.3), u(0.36), 0, Math.PI * 2);
    ctx.fillStyle = C.parchment;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(u(18.15), u(13.3), u(0.36), 0, Math.PI * 2);
    ctx.fill();
  }
}

sizes.forEach((size) => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  if (size === 16) {
    ctx.imageSmoothingEnabled = false;
    const px = (x, y, fill) => { ctx.fillStyle = fill; ctx.fillRect(x, y, 1, 1); };
    ctx.fillStyle = C.roast;
    ctx.fillRect(0, 0, 16, 16);
    for (let i = 1; i < 15; i++) {
      px(i, 0, C.copper); px(i, 15, C.copper);
      px(0, i, C.copper); px(15, i, C.copper);
    }
    px(1, 1, C.copper); px(14, 1, C.copper);
    px(1, 14, C.copper); px(14, 14, C.copper);
    for (let y = 3; y <= 7; y++) { px(3, y, C.red); px(4, y, C.red); }
    px(3, 3, C.roast); px(4, 2, C.red);
    for (let y = 2; y <= 6; y++) { px(7, y, C.gold); px(8, y, C.gold); }
    px(7, 2, C.roast); px(8, 1, C.gold);
    for (let y = 3; y <= 7; y++) { px(11, y, C.copper); px(12, y, C.copper); }
    px(12, 3, C.roast); px(11, 2, C.copper);
    for (let y = 6; y <= 10; y++) {
      for (let x = 6; x <= 10; x++) {
        if ((x - 8) ** 2 + (y - 8) ** 2 <= 5) px(x, y, C.tan);
      }
    }
    px(8, 10, C.gold); px(7, 10, C.gold); px(9, 10, C.gold);
    for (let y = 11; y <= 13; y++) {
      for (let x = 5; x <= 11; x++) {
        if ((y === 11 || y === 13) && (x === 5 || x === 11)) continue;
        px(x, y, C.body);
      }
    }
    for (let x = 6; x <= 10; x++) px(x, 11, C.breast);
  } else {
    const pad = size * 0.05;
    const rad = size * 0.2;
    roundRect(ctx, pad, pad, size - pad * 2, size - pad * 2, rad);
    ctx.fillStyle = C.roast;
    ctx.fill();
    ctx.lineWidth = Math.max(1, size * 0.018);
    ctx.strokeStyle = 'rgba(212, 118, 44, 0.7)';
    ctx.stroke();
    drawTurkey(ctx, size);
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'tile';
  const label = document.createElement('strong');
  label.textContent = `icon${size}.png`;
  const zoom = Math.max(size * 2, 96);
  canvas.style.width = `${zoom}px`;
  canvas.style.height = `${zoom}px`;
  canvas.style.imageRendering = size <= 32 ? 'pixelated' : 'auto';
  const link = document.createElement('a');
  link.download = `icon${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.textContent = 'download';
  wrapper.append(label, canvas, link);
  document.getElementById('icons').appendChild(wrapper);
});
</script>
</body>
</html>
